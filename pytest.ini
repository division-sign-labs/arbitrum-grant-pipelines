[pytest]
testpaths = tests
# The default run is offline and cheap: no Dune credits, no Neynar quota, no
# Neo4j. Anything that touches a real endpoint must carry @pytest.mark.live and
# is excluded here; run it explicitly with `pytest -m live`.
addopts = -ra --strict-markers -m "not live"
markers =
    live: hits a real network endpoint (Dune/Neynar/Clanker/Bankr/Hyperliquid/Neo4j); excluded by default
filterwarnings =
    error::DeprecationWarning:lib.*
    error::DeprecationWarning:pipelines.*
    error::DeprecationWarning:ingestion.*
